<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clickbait Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 300px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
    }
    .header {
      background: linear-gradient(135deg, #0f3460, #16213e);
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid #0f3460;
    }
    .header h1 { font-size: 15px; font-weight: 600; color: #e0e0e0; }
    .header span { font-size: 24px; }
    .status-card {
      margin: 14px;
      padding: 14px;
      border-radius: 10px;
      background: #16213e;
      border: 1px solid #0f3460;
    }
    .label-badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-legitimate { background: #1b5e20; color: #a5d6a7; }
    .badge-phishing   { background: #b71c1c; color: #ffcdd2; }
    .badge-clickbait  { background: #e65100; color: #ffe0b2; }
    .badge-unknown    { background: #37474f; color: #b0bec5; }
    .confidence-bar {
      height: 6px;
      background: #0f3460;
      border-radius: 3px;
      overflow: hidden;
      margin: 8px 0;
    }
    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.4s ease;
    }
    .fill-legitimate { background: #4caf50; }
    .fill-phishing   { background: #f44336; }
    .fill-clickbait  { background: #ff9800; }
    .fill-unknown    { background: #78909c; }
    .conf-label { font-size: 11px; color: #90a4ae; margin-top: 4px; }
    .probs { margin-top: 12px; }
    .prob-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: #b0bec5;
      margin: 3px 0;
    }
    .footer {
      padding: 10px 14px;
      font-size: 11px;
      color: #546e7a;
      text-align: center;
      border-top: 1px solid #0f3460;
    }
    .scan-btn {
      width: calc(100% - 28px);
      margin: 0 14px 14px;
      padding: 10px;
      background: #0f3460;
      color: #e0e0e0;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: background 0.2s;
    }
    .scan-btn:hover { background: #1a4a8a; }
  </style>
</head>
<body>
  <div class="header">
    <span>🛡️</span>
    <h1>Clickbait Detector</h1>
  </div>

  <div class="status-card" id="status-card">
    <span class="label-badge badge-unknown" id="label-badge">Scanning...</span>
    <div class="confidence-bar">
      <div class="confidence-fill fill-unknown" id="confidence-fill" style="width: 0%"></div>
    </div>
    <p class="conf-label" id="conf-label">Waiting for result...</p>
    <div class="probs" id="probs"></div>
  </div>

  <button class="scan-btn" id="scan-btn">🔄 Re-scan This Page</button>

  <div class="footer">Group 10 — EE7204 Computer Vision Project</div>

  <script src="popup.js"></script>
</body>
</html>
