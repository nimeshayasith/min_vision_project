<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Clickbait Detector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 310px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1117;
      color: #e0e0e0;
    }

    /* ── Header ── */
    .header {
      background: linear-gradient(135deg, #1a1a2e, #16213e);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .header-icon { font-size: 22px; }
    .header-text h1 { font-size: 14px; font-weight: 700; color: #e8e8e8; }
    .header-text p  { font-size: 10px; color: #546e7a; margin-top: 1px; }

    /* ── Status Card ── */
    .status-card {
      margin: 12px;
      padding: 14px;
      border-radius: 12px;
      background: #16213e;
      border: 1px solid rgba(255,255,255,0.07);
    }

    /* ── Label Badge ── */
    .label-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }
    .badge-legitimate { background: #1b5e20; color: #a5d6a7; border: 1px solid #2e7d32; }
    .badge-clickbait  { background: #7f1d1d; color: #fca5a5; border: 1px solid #991b1b; }
    .badge-unknown    { background: #1e293b; color: #94a3b8; border: 1px solid #334155; }

    /* ── Confidence Bar ── */
    .confidence-bar {
      height: 6px;
      background: rgba(255,255,255,0.08);
      border-radius: 3px;
      overflow: hidden;
      margin: 6px 0;
    }
    .confidence-fill {
      height: 100%;
      border-radius: 3px;
      transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .fill-legitimate { background: linear-gradient(90deg, #22c55e, #16a34a); }
    .fill-clickbait  { background: linear-gradient(90deg, #f87171, #dc2626); }
    .fill-unknown    { background: #475569; }

    .conf-label { font-size: 11px; color: #64748b; margin-top: 4px; }

    /* ── Detection List ── */
    .probs {
      margin-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.06);
      padding-top: 10px;
    }
    .prob-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: #94a3b8;
      margin: 5px 0;
      padding: 4px 6px;
      border-radius: 6px;
      transition: background 0.15s;
    }
    .prob-row:hover { background: rgba(255,255,255,0.04); }
    .prob-row span:last-child {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }

    /* ── Divider ── */
    .divider { height: 1px; background: rgba(255,255,255,0.05); margin: 0 12px; }

    /* ── Scan Button ── */
    .scan-btn {
      width: calc(100% - 24px);
      margin: 12px;
      padding: 10px;
      background: linear-gradient(135deg, #1e3a5f, #0f3460);
      color: #e0e0e0;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.2s;
      letter-spacing: 0.3px;
    }
    .scan-btn:hover  { background: linear-gradient(135deg, #1a4a8a, #1e3a5f); transform: translateY(-1px); }
    .scan-btn:active { transform: translateY(0); }
    .scan-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Footer ── */
    .footer {
      padding: 8px 14px 12px;
      font-size: 10px;
      color: #334155;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="header-icon">🛡️</span>
    <div class="header-text">
      <h1>Clickbait Detector</h1>
      <p>CV + YOLOv8 Element Detection</p>
    </div>
  </div>

  <div class="status-card" id="status-card">
    <span class="label-badge badge-unknown" id="label-badge">Scanning...</span>
    <div class="confidence-bar">
      <div class="confidence-fill fill-unknown" id="confidence-fill" style="width: 0%"></div>
    </div>
    <p class="conf-label" id="conf-label">Waiting for result...</p>
    <div class="probs" id="probs" style="display:none"></div>
  </div>

  <div class="divider"></div>
  <button class="scan-btn" id="scan-btn">🔄 Re-scan This Page</button>

  <div class="footer">Group 10 — EC7205 Computer Vision &amp; Image Processing</div>

  <script src="popup.js"></script>
</body>
</html>
